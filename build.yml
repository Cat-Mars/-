name: 构建喵喵.exe
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 编译
        shell: cmd
        run: |
          dir
          "%windir%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /unsafe /out:"%cd%\喵喵.exe" "%cd%\喵喵.cs"
          if errorlevel 1 exit /b 1
      - name: 打包（exe + 猫图 + 说明）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item 喵喵.exe, 喵喵.png, README.md out -ErrorAction SilentlyContinue
          Compress-Archive -Path out\* -DestinationPath 喵喵.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: 喵喵
          path: 喵喵.zip
